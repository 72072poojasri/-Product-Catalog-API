version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: 'postgresql://user:password@db:5432/products_db'
      REDIS_URL: 'redis://redis:6379/0'
      CACHE_TTL_SECONDS: 60
      RATE_LIMIT_MAX_REQUESTS: 50
      RATE_LIMIT_WINDOW_SECONDS: 60
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"] # Example health check
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:14-alpine # or mysql:8
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Or other seeding mechanism
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes # Enable persistence

volumes:
  db_data:
  redis_data:
